name: Validate SQL

on:
  push:
    paths:
      - '**.sql'
  pull_request:
    paths:
      - '**.sql'
  workflow_dispatch:

jobs:
  lint-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Lint all SQL files
        run: |
          sqlfluff lint . --dialect bigquery || true
          echo "---"
          echo "Lint complete. Review warnings above."

  dry-run:
    runs-on: ubuntu-latest
    if: false  # Disabled by default — requires GCP credentials in secrets
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Dry-run queries against BigQuery
        run: |
          for file in $(find . -name "*.sql" -type f); do
            echo "Dry run: $file"
            bq query --use_legacy_sql=false --dry_run --project_id=${{ secrets.GCP_PROJECT_ID }} < "$file" \
              && echo "  OK" || echo "  FAILED"
          done
