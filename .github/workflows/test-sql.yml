name: Validate SQL

on:
  push:
    paths:
      - '**.sql'
      - '**.sqlx'
  pull_request:
    paths:
      - '**.sql'
      - '**.sqlx'
  workflow_dispatch:

jobs:
  lint-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Lint plain SQL files
        # Only lint standalone-sql/ — Dataform .sqlx files contain JS template
        # expressions (${ref(...)}, ${constants.X}, etc.) that are not valid
        # BigQuery SQL and produce false-positive SQLFluff errors.
        run: sqlfluff lint standalone-sql/ --dialect bigquery
